<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FrogPools — Activity</title>
<meta name="description" content="Live on-chain activity across FrogPools — stakes, router compounds, claims and milestones on pools.trade pools.">
<meta name="theme-color" content="#8CBE1B">
<link rel="icon" type="image/png" href="assets/frog-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body data-page="activity">
<div id="nav-mount"></div>

<div class="wrap pagetitle">
  <h1>Activity</h1>
  <p>Every stake, router compound, claim and milestone across FrogPools pools — live from Robinhood Chain.</p>
</div>

<main class="wrap">
  <div class="shead" style="margin-top:24px">

    <span class="wallet" style="display:inline-flex"><span class="av"></span> Live feed</span>
  </div>
  <div class="tblwrap">
    <table class="dtable">
      <thead><tr><th class="l">Wallet</th><th class="l">Action</th><th class="l">Pool</th><th class="hide-m">Trigger</th><th>Amount</th><th class="hide-m">Value</th><th class="hide-m">When</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div class="pag"><a href="#">←</a><a class="on" href="#">1</a><a href="#">2</a><a href="#">3</a><a href="#">4</a><a href="#">5</a><a href="#">→</a></div>
</main>

<div id="foot-mount"></div>
<script src="app-shell.js"></script>

</body>
</html>
